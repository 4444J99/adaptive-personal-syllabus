# Agent claim registry — adaptive-personal-syllabus #36 (MTR-010).
#
# One active lease per scope. The steward grants a lease; the grant is a
# record, not a comment (ADR 006). `agent_claims.py` evaluates claims
# against this file — it never grants, revokes, or writes it.
#
# Lease lifecycle: active (fencing) -> fulfilled (work merged) | expired
# (expiry passed; scope free) | revoked (steward action). A lease that is
# active past its expiry is a registry violation: the self-check fails
# until the steward flips it to expired. Fulfilled and expired leases move
# to grant_history; only `leases` fences.
#
# The active list is empty at this head. Grants are recorded in
# grant_history with their receipts, per the #36 precedent — the shipped-
# registry test (tests/test_agent_claims.py) pins the registry to no
# active lease, so a grant in flight is recorded in grant_history and
# the `leases` fence does not cover it; the grant record on #21 is the
# authoritative act (ADR 006). The steward flips a grant to fulfilled
# when its work merges. The first grant (#36) is fulfilled — its work
# merged via PR #86 at 38d87112. The second grant (#37) is fulfilled —
# its work merged via PR #87 at 6b2b4b90.
#
# Amended by #38 (MTR-039): sequence 3 recorded in grant_history (grant
# on #21, comment 7081372121); sequence 2 flipped to fulfilled (work
# merged via PR #87 at 6b2b4b90); re-verified against live main 6b2b4b90.
#
# Scope entries are repo-relative paths. An entry naming a file covers
# that file; an entry ending in `/` covers everything under that directory.
