name: Python CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Clone koinonia-db seed data
        run: |
          git clone https://github.com/4444J99/koinonia-db.git ../koinonia-db
          git -C ../koinonia-db checkout --detach 3fe455fcbdeca98ab209f38a6b892dc29217c6a1

      - name: Install koinonia-db from git
        run: pip install "koinonia-db @ git+https://github.com/4444J99/koinonia-db.git@3fe455fcbdeca98ab209f38a6b892dc29217c6a1"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy src

      - name: CLI smoke test
        run: |
          syllabus --help
          syllabus corpus --help
          syllabus ledger --help
          syllabus profile --help
          syllabus plan --help
          syllabus chamber --help
          syllabus docs --help
          aps --help

      - name: Docs audit gate
        run: |
          syllabus docs audit \
            --root ./docs \
            --snapshot ci-docs \
            --format json \
            --write-json ./docs-audit-ci.json \
            --write-md ./docs-audit-ci.md \
            --db-path ./docs-audit-ci.db > /tmp/docs-audit-output.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("/tmp/docs-audit-output.json").read_text())
          assert payload["ingest_verification"]["all_files_ingested"] is True
          assert payload["suggestions"]["count"] > 0
          assert payload["milestones"]["recommended_start_milestone"] is not None
          PY

      - name: Test with pytest
        run: pytest --cov=. --cov-report=xml --cov-report=term --cov-report=html

      - name: Agent claim check (leases + PR scope)
        run: |
          python -m adaptive_personal_syllabus.agent_claims --self-check
          if [ -n "${{ github.head_ref }}" ]; then
            git diff --name-only origin/main...HEAD > /tmp/changed-files.txt
            python -m adaptive_personal_syllabus.agent_claims --pr-check \
              --branch "${{ github.head_ref }}" \
              --changed-files /tmp/changed-files.txt \
              --pr-base "${{ github.event.pull_request.base.sha }}"
          else
            echo "not a pull request; PR scope check skipped"
          fi

      - name: Upload docs audit artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: docs-audit-${{ matrix.python-version }}
          path: |
            docs-audit-ci.json
            docs-audit-ci.md

      - name: Upload coverage to Codecov
        if: success() && hashFiles('coverage.xml') != ''
        uses: codecov/codecov-action@v7
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          flags: unittests
          name: codecov-${{ matrix.python-version }}

  # Q3 guard (#42, MTR-008): a clean public checkout builds, passes, and
  # runs the documented end-to-end flow with no sibling koinonia-db clone
  # and no credentials. The `koinonia-db` dependency resolves from the
  # canonical URL in pyproject.toml; tests use the synthetic fixture seed.
  clean-checkout:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install from the public clone alone
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Lint with ruff
        run: ruff check .

      - name: Type check with mypy
        run: mypy src

      - name: Test with pytest (no sibling seed)
        run: pytest -q

      - name: Agent claim check (registry consistency)
        run: python -m adaptive_personal_syllabus.agent_claims --self-check

      - name: Synthetic end-to-end run
        run: |
          syllabus corpus ingest --root ./docs --snapshot clean-checkout --db-path ./clean.db
          syllabus profile init --name Learner --organs I --purpose evaluate --phone-only --output ./profile.json --db-path ./clean.db
          syllabus plan generate --profile ./profile.json --seed-dir ./tests/fixtures/seed --format json --db-path ./clean.db
          syllabus plan show 1 --format md --db-path ./clean.db
