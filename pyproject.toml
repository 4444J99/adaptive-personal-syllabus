[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-personal-syllabus"
version = "0.6.0"
description = "Personalized learning path generator for the organvm eight-organ system"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "click>=8.0",
    "PyYAML>=6.0",
    "koinonia-db @ git+https://github.com/4444J99/koinonia-db.git@3fe455fcbdeca98ab209f38a6b892dc29217c6a1",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.7", "mypy==2.4.1", "types-PyYAML==6.0.12.20260906"]

[project.scripts]
syllabus = "adaptive_personal_syllabus.core:cli"
aps = "adaptive_personal_syllabus.core:cli"
aps-data-export = "adaptive_personal_syllabus.data_export:main"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
# koinonia-db ships no py.typed marker, so its imports are untyped upstream
# (#42, MTR-008: bare `mypy src` must pass on a clean checkout; CI previously
# masked this with --ignore-missing-imports for the whole tree). Everything
# else stays strictly checked.
[[tool.mypy.overrides]]
module = "koinonia_db.*"
ignore_missing_imports = true
