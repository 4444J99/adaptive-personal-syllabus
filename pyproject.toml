[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-personal-syllabus"
version = "0.6.0"
description = "Personalized learning path generator for the organvm eight-organ system"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "click>=8.0",
    "PyYAML>=6.0",
    "koinonia-db @ git+https://github.com/organvm-vi-koinonia/koinonia-db.git@276b0c1ab4fa1e46c11938d60c638ba380cbff68",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0", "ruff==0.16.7", "mypy==2.3.1", "types-PyYAML==6.0.12.20260906"]

[project.scripts]
syllabus = "adaptive_personal_syllabus.core:cli"
aps = "adaptive_personal_syllabus.core:cli"
aps-data-export = "adaptive_personal_syllabus.data_export:main"

[tool.ruff]
target-version = "py311"
line-length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
